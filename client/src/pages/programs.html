<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GUYGD – Projects</title>
  <link rel="stylesheet" href="/src/css/main.css"/>
  <link rel="stylesheet" href="/src/css/responsive.css"/>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="nav-logo">GUYGD</a>
      <button class="hamburger" aria-label="Menu"></button>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <div class="page-hero">
    <h1>Our Projects</h1>
    <p>Initiatives designed to empower, educate, and uplift our community.</p>
  </div>

  <section class="section">
    <div class="container">
      <div id="programs-container" class="programs-grid">
        <div style="text-align:center;padding:40px;color:#6b7280;grid-column:1/-1;">Loading projects...</div>
      </div>
    </div>
  </section>

  <section class="section bg-light">
    <div class="container cta-box">
      <h2>Get Involved</h2>
      <p>Join us as a member, volunteer, or donor and help us expand these projects.</p>
      <div class="hero-btns">
        <a href="/membership.html" class="btn btn-primary">Become a Member</a>
        <a href="/donate.html" class="btn btn-green">Support a Project</a>
      </div>
    </div>
  </section>

  <footer id="footer"></footer>
  <script src="/src/js/main.js"></script>
  <script>
    (async function loadProjects() {
      const c = document.getElementById('programs-container');
      try {
        const res = await fetch('/api/programs');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!data.length) {
          c.innerHTML = '<div style="text-align:center;padding:40px;color:#6b7280;grid-column:1/-1;">No projects have been added yet.</div>';
          return;
        }
        c.innerHTML = data.map(p => `
          <div class="program-block">
            ${p.image_url ? `<img src="${p.image_url}" alt="${p.title}"/>` : ''}
            <div class="program-block-body">
              <h2>${p.icon ? p.icon + ' ' : ''}${p.title}</h2>
              <p>${p.description || ''}</p>
              ${p.bullets ? `<ul>${p.bullets.split('\n').map(b => b.trim() ? `<li>${b.trim()}</li>` : '').join('')}</ul>` : ''}
            </div>
          </div>`).join('');
      } catch(err) {
        c.innerHTML = `<div style="text-align:center;padding:40px;color:#e74c3c;grid-column:1/-1;">Could not load projects: ${err.message}</div>`;
      }
    })();
  </script>
</body>
</html>
