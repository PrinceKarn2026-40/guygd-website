<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GUYGD – Projects</title>
  <link rel="stylesheet" href="/src/css/main.css"/>
  <link rel="stylesheet" href="/src/css/responsive.css"/>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="nav-logo">GUYGD</a>
      <button class="hamburger" aria-label="Menu"></button>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <div class="page-hero">
    <h1>Our Projects</h1>
    <p>Initiatives designed to empower, educate, and uplift our community.</p>
  </div>

  <section class="section">
    <div class="container" id="programs-container">
      <div style="text-align:center;padding:40px;color:#6b7280;">Loading projects...</div>
    </div>
  </section>

  <section class="section bg-light">
    <div class="container cta-box">
      <h2>Get Involved</h2>
      <p>Join us as a member, volunteer, or donor and help us expand these projects.</p>
      <div class="hero-btns">
        <a href="/membership.html" class="btn btn-primary">Become a Member</a>
        <a href="/donate.html" class="btn btn-green">Support a Project</a>
      </div>
    </div>
  </section>

  <footer id="footer"></footer>
  <script src="/src/js/main.js"></script>
  <script>
    const API = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';

    function renderPrograms(list) {
      const c = document.getElementById('programs-container');
      if (!list.length) {
        c.innerHTML = '<div style="text-align:center;padding:40px;color:#6b7280;">No projects have been added yet.</div>';
        return;
      }
      c.innerHTML = list.map((p, i) => `
        <div class="program-block ${i % 2 !== 0 ? 'reverse' : ''}">
          <div class="program-img">
            ${p.image_url
              ? `<img src="${p.image_url}" alt="${p.title}" style="width:100%;max-width:340px;border-radius:14px;object-fit:cover;aspect-ratio:4/3;"/>`
              : `<div style="width:100%;max-width:340px;aspect-ratio:4/3;border-radius:14px;background:linear-gradient(135deg,#052e16,#2d6a4f);display:flex;align-items:center;justify-content:center;font-size:4rem;">${p.icon || '📌'}</div>`}
          </div>
          <div class="program-info">
            <h2>${p.icon ? p.icon + ' ' : ''}${p.title}</h2>
            <p>${p.description || ''}</p>
            ${p.bullets ? `<ul>${p.bullets.split('\n').map(b => b.trim() ? `<li>${b.trim()}</li>` : '').join('')}</ul>` : ''}
          </div>
        </div>`).join('');
    }

    async function loadPrograms() {
      const c = document.getElementById('programs-container');
      try {
        const res = await fetch(`${API}/programs`);
        if (!res.ok) throw new Error('Failed');
        const data = await res.json();
        renderPrograms(Array.isArray(data) ? data : []);
      } catch {
        c.innerHTML = '<div style="text-align:center;padding:40px;color:#e74c3c;">Could not load projects. Please try again later.</div>';
      }
    }

    loadPrograms();
  </script>
</body>
</html>
